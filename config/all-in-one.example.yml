# tokenlive-standalone all-in-one example
# Implied deploy_mode: all-in-one (Gateway + Admin both required)
# Admin TOML still loaded from -admin-workdir (sibling tokenlive-admin/configs by default)

env: local
http:
  host: 127.0.0.1
  port: 2525

# Must be embedded in all-in-one (fail-fast if not)
gateway:
  config_source: embedded
  state_store: memory
  # Single-host self-report: gateway posts metrics/events back to the co-hosted
  # admin over HTTP so the dashboard (总览) and ops monitor (运维看板) have data.
  admin_url: http://127.0.0.1:2525
  sync_token: ${GATEWAY_SYNC_TOKEN:}

data:
  redis:
    addr: ${REDIS_ADDR:}
    password: ${REDIS_PASSWORD:}
    db: ${REDIS_DB:0}

events:
  enabled: true
  type: http

log:
  log_level: info
  mode: console
  encoding: console
  log_file_name: "./data/logs/tokenlive.log"
  max_backups: 3
  max_age: 7
  max_size: 100
  compress: false

llm:
  enable_auth: false
  enable_metrics: false
  enable_logging: true

models: {}
providers: {}

pipelines:
  chat_completion:
    name: chat_completion
    request_types: ["chat_completion"]
    # No "auth" inbound filter: this local profile runs with llm.enable_auth=false,
    # so requests carry no user/tenant and the auth filter would 401 every call.
    inbound_filters: ["validate"]
    outbound_filters: ["metrics", "status_collector", "access_log", "event_publisher"]
    critical_outbound_filters: []
    invoker:
      type: cluster
      routers: ["capability", "priority"]
      load_balancer: round_robin
      retry:
        retry: 0
        backoff_type: fixed
        base_ms: 0
        error_codes: ["500"]

# Local fallback policy for single-host cold start: when no dynamic policy is
# configured in the admin DB, the gateway would otherwise 403 with
# "no dynamic policy matched". This permissive policy lets requests through.
policies:
  - permissions: ["*"]

access_log:
  clickhouse:
    enabled: false
