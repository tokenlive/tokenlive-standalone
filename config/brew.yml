# Default config installed by Homebrew (etc/tokenlive/config.yml).
# Paths under data-dir / share are set by the brew service command line.

env: prod
http:
  host: 127.0.0.1
  port: 2525

gateway:
  config_source: embedded
  state_store: memory
  # Single-host self-report: gateway posts metrics/events back to the co-hosted
  # admin over HTTP so the dashboard (总览) and ops monitor (运维看板) have data.
  admin_url: http://127.0.0.1:2525
  sync_token: ${GATEWAY_SYNC_TOKEN:}

# Optional Redis — leave empty for pure single-host memory mode
data:
  redis:
    addr: ${REDIS_ADDR:}
    password: ${REDIS_PASSWORD:}
    db: ${REDIS_DB:0}

events:
  enabled: true
  type: http

log:
  log_level: info
  mode: both
  encoding: json
  log_file_name: "logs/tokenlive.log"
  max_backups: 7
  max_age: 14
  max_size: 100
  compress: true

llm:
  enable_auth: true
  enable_metrics: true
  enable_logging: true
  api_key_pepper: ${GATEWAY_API_KEY_PEPPER:}

models: {}
providers: {}

pipelines:
  chat_completion:
    name: chat_completion
    request_types: ["chat_completion"]
    inbound_filters: ["auth", "validate"]
    outbound_filters: ["metrics", "status_collector", "access_log", "event_publisher"]
    critical_outbound_filters: []
    invoker:
      type: cluster
      routers: ["capability", "priority"]
      load_balancer: round_robin
      retry:
        retry: 0
        backoff_type: fixed
        base_ms: 0
        error_codes: ["500"]

access_log:
  clickhouse:
    enabled: false

# Local fallback policy for single-host cold start: when no dynamic policy is
# configured in the admin DB, the gateway would otherwise 403 with
# "no dynamic policy matched". This permissive policy lets requests through.
policies:
  - permissions: ["*"]
